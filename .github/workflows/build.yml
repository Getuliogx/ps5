name: build-irx
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    env:
      PS2DEV: /usr/local/ps2dev
      PS2SDK: /usr/local/ps2dev/ps2sdk
    steps:
      - uses: actions/checkout@v4

      - name: Info do SDK
        shell: sh
        run: |
          mkdir -p out/MODULES
          { echo "PS2SDK=$PS2SDK"; find $PS2SDK -name "*.irx" | sort; echo; ls $PS2SDK/samples 2>&1; echo; find $PS2SDK -name "ps2ip.h" -o -name "irx_imports.h" -o -name "sockets.h" | sort; } > out/sdk_info.txt 2>&1 || true

      - name: Compilar
        id: compilar
        continue-on-error: true
        shell: sh
        run: |
          apk add --no-cache make bash git build-base > out/apk_log.txt 2>&1 || true
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin
          { which make; which mipsel-ps2-irx-gcc; echo "PATH=$PATH"; } > out/build_log.txt 2>&1 || true
          make -C iop >> out/build_log.txt 2>&1 && echo "COMPILOU OK" >> out/build_log.txt

      - name: MOSTRAR LOG DE COMPILACAO
        if: always()
        shell: sh
        run: |
          echo "=============== build_log.txt ==============="
          cat out/build_log.txt
          echo "=============== sdk_info.txt (parcial) ==============="
          grep -v "\.irx$" out/sdk_info.txt
          grep -E "ps2dev9|netman|smap|ps2ip|ps2smap" out/sdk_info.txt || true

      - name: Reunir arquivos
        if: always()
        shell: sh
        run: |
          cp iop/loader/loader.irx out/MODULES/CXTMDM.IRX   2>/dev/null || true
          cp iop/loader/loader.irx out/MODULES/OSTMDM_A.IRX 2>/dev/null || true
          for n in AVEPPP AVE_WRAP AVETCP; do cp iop/empty/empty.irx out/MODULES/$n.IRX 2>/dev/null || true; done
          cp iop/avewrap/avewrap2.irx out/MODULES/AVEWRAP2.IRX 2>/dev/null || true
          cp $PS2SDK/iop/irx/ps2dev9.irx out/MODULES/PS2DEV9.IRX 2>/dev/null || true
          cp $PS2SDK/iop/irx/netman.irx  out/MODULES/NETMAN.IRX  2>/dev/null || true
          cp $PS2SDK/iop/irx/smap.irx    out/MODULES/SMAP.IRX    2>/dev/null || true
          if [ -f $PS2SDK/iop/irx/ps2ip-nm.irx ]; then cp $PS2SDK/iop/irx/ps2ip-nm.irx out/MODULES/PS2IP.IRX; else cp $PS2SDK/iop/irx/ps2ip.irx out/MODULES/PS2IP.IRX 2>/dev/null || true; fi
          ls -l out/MODULES > out/modules_list.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvc2-online
          path: out/

      - name: FALHAR se nao compilou
        shell: sh
        run: |
          for f in iop/loader/loader.irx iop/empty/empty.irx iop/avewrap/avewrap2.irx; do
            if [ ! -f "$f" ]; then echo "ERRO: $f nao foi gerado. Veja o log acima."; exit 1; fi
          done
          echo "Todos os modulos compilaram."
